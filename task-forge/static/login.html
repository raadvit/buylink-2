<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Task forge — Přihlášení</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
<style>
/* ── Stage ── */
.login-stage {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 80px 24px;
  overflow: hidden;
}
.login-stage::before {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, oklch(88% 0.008 95) 1px, transparent 1px);
  background-size: 24px 24px;
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
          mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
  opacity: 0.6;
  pointer-events: none;
  z-index: 0;
}

/* ── Wordmark ── */
.wordmark {
  position: absolute;
  top: 32px;
  left: 40px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  z-index: 1;
}
.wordmark-tile {
  width: 26px; height: 26px;
  border-radius: 7px;
  background: var(--ink);
  color: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  letter-spacing: -0.02em;
}

/* ── Card ── */
.login-card {
  position: relative;
  width: 100%;
  max-width: 440px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 44px;
  box-shadow:
    0 24px 64px -32px oklch(20% 0.02 280 / 0.18),
    0 4px 16px -8px oklch(20% 0.02 280 / 0.06);
  display: flex;
  flex-direction: column;
  gap: 28px;
  z-index: 1;
}
.login-header {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
}
.login-logo {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--ink);
  color: var(--surface);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 8px;
  box-shadow: 0 6px 16px -8px oklch(20% 0.02 280 / 0.3);
}
.login-header h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.login-header p {
  margin: 0;
  font-size: 14px;
  color: var(--ink-3);
  line-height: 1.5;
  text-wrap: pretty;
}

/* ── SSO button ── */
.btn-sso {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 13px 16px;
  background: var(--accent);
  color: var(--surface);
  border: 0;
  border-radius: 10px;
  font: inherit;
  font-size: 14.5px;
  font-weight: 600;
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: background 120ms, transform 120ms;
  box-shadow:
    inset 0 1px 0 0 oklch(40% 0.16 290 / 0.4),
    0 4px 10px -4px oklch(52% 0.18 290 / 0.4);
  position: relative;
}
.btn-sso:hover:not(:disabled) { background: oklch(48% 0.19 290); }
.btn-sso:active:not(:disabled) { transform: translateY(1px); }
.btn-sso:disabled { opacity: 0.75; cursor: not-allowed; }
.btn-sso svg { opacity: 0.85; margin-left: 2px; flex-shrink: 0; }
.btn-sso[data-loading="1"] { pointer-events: none; }
.btn-sso[data-loading="1"]::before {
  content: '';
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1.6px solid currentColor;
  border-top-color: transparent;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Info banner ── */
.info-banner {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 12px 14px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 12.5px;
  color: var(--ink-3);
  line-height: 1.5;
}
.info-banner svg { flex-shrink: 0; margin-top: 1px; }

/* ── Mobile ── */
@media (max-width: 540px) {
  .login-card { padding: 36px 28px; }
  .wordmark { top: 20px; left: 20px; }
}
</style>
</head>
<body>
  <main class="login-stage">
    <a href="/" class="wordmark">
      <div class="wordmark-tile">TF</div>
      <span>Task forge</span>
    </a>

    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">TF</div>
        <h1>Přihlášení</h1>
        <p>Pro pokračování se přihlaste svým GitHub účtem. Task forge používá GitHub SSO.</p>
      </div>

      <button type="button" class="btn-sso" id="sso-btn">
        <span>Pokračovat přes GitHub</span>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M5 3 L11 8 L5 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="info-banner">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <circle cx="8" cy="8" r="6.25" stroke="currentColor" stroke-width="1.4"/>
          <path d="M8 5.5 V8.5 M8 10.5 V10.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span>Po přihlášení budete přesměrováni zpět do Task forge.</span>
      </div>
    </div>
  </main>

  <script src="/static/login.js" defer></script>
</body>
</html>
