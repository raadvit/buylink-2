<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Fronta — Task Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
<style>
  .queue-page { padding: 40px 56px 80px; max-width: 860px; margin: 0 auto; }
  .queue-page__title { font-size: 22px; font-weight: 700; margin: 0 0 28px; }

  .queue-list { display: flex; flex-direction: column; gap: 10px; }

  .queue-item {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line-1);
  }
  .queue-item--active {
    border-color: var(--accent);
    background: oklch(97% 0.02 290);
  }

  .queue-pos {
    font-size: 11px; font-weight: 600; color: var(--ink-4);
    min-width: 24px; text-align: center; flex-shrink: 0;
  }
  .queue-item--active .queue-pos { color: var(--accent); }

  .queue-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .queue-id {
    font-size: 11px; font-weight: 600; color: var(--ink-4); font-family: var(--mono);
    text-decoration: none;
  }
  .queue-id:hover { color: var(--accent); }
  .queue-name { font-size: 13.5px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .queue-command {
    font-size: 12px; font-family: var(--mono); font-weight: 500;
    color: var(--accent); background: oklch(94% 0.04 290); border-radius: 5px;
    padding: 3px 8px; white-space: nowrap; flex-shrink: 0;
  }

  .queue-times { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; min-width: 90px; }
  .queue-time-label { font-size: 10px; color: var(--ink-4); text-transform: uppercase; letter-spacing: .05em; }
  .queue-time-val { font-size: 12px; font-family: var(--mono); color: var(--ink-3); }
  .queue-timer { font-size: 14px; font-family: var(--mono); font-weight: 600; color: var(--accent); letter-spacing: .04em; }

  .queue-status-badge {
    font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 20px; flex-shrink: 0;
  }
  .queue-status-badge--queued  { background: oklch(93% 0.03 60);  color: oklch(45% 0.12 60); }
  .queue-status-badge--active  { background: oklch(93% 0.04 290); color: var(--accent-ink); }

  .queue-empty {
    padding: 56px 0; text-align: center;
    color: var(--ink-4); font-size: 14px;
  }
  .queue-empty svg { display: block; margin: 0 auto 16px; opacity: .35; }
</style>
</head>
<body>

<script src="/static/nav.js"></script>

<div class="queue-page">
  <h1 class="queue-page__title">Fronta</h1>
  <div class="queue-list" id="queueList">
    <div class="queue-empty">Načítám…</div>
  </div>
</div>

<script>
initNav('queue');

const list = document.getElementById('queueList');
const _timers = {};

function issueLabel(n) {
  return n ? 'US-' + String(n).padStart(3, '0') : '—';
}

function fmtTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts * 1000);
  return d.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });
}

function fmtDuration(startTs) {
  const secs = Math.floor(Date.now() / 1000 - startTs);
  const m = Math.floor(secs / 60);
  const s = secs % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function startTimers() {
  Object.keys(_timers).forEach(k => clearInterval(_timers[k]));
  document.querySelectorAll('.queue-timer[data-start]').forEach(el => {
    const startTs = parseFloat(el.dataset.start);
    el.textContent = fmtDuration(startTs);
    _timers[el.dataset.start] = setInterval(() => {
      el.textContent = fmtDuration(startTs);
    }, 1000);
  });
}

function render(items) {
  Object.keys(_timers).forEach(k => clearInterval(_timers[k]));

  if (!items.length) {
    list.innerHTML = `
      <div class="queue-empty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="3" rx="1"/><rect x="3" y="10.5" width="14" height="3" rx="1"/><rect x="3" y="17" width="8" height="3" rx="1"/>
        </svg>
        Fronta je prázdná
      </div>`;
    return;
  }

  // Seřadit: ten co běží je dole, čekající nad ním sestupně dle pořadí
  const sorted = [...items].sort((a, b) => {
    if (a.status === 'analyzing' && b.status !== 'analyzing') return 1;
    if (b.status === 'analyzing' && a.status !== 'analyzing') return -1;
    return (b.queue_position || 0) - (a.queue_position || 0);
  });

  list.innerHTML = sorted.map((item, i) => {
    const isActive = item.status === 'analyzing';
    const label = issueLabel(item.issue_number);
    const href = item.issue_number ? `/us-${item.issue_number}` : '#';
    const badge = isActive
      ? '<span class="queue-status-badge queue-status-badge--active">Běží</span>'
      : '<span class="queue-status-badge queue-status-badge--queued">Čeká</span>';
    const pos = isActive ? '▶' : String(item.queue_position || (sorted.length - i));

    const timesHtml = isActive && item.started_at
      ? `<div class="queue-times">
           <div class="queue-time-label">Přidáno</div>
           <div class="queue-time-val">${fmtTime(item.created_at)}</div>
           <div class="queue-time-label" style="margin-top:4px">Doba běhu</div>
           <div class="queue-timer" data-start="${item.started_at}">${fmtDuration(item.started_at)}</div>
         </div>`
      : `<div class="queue-times">
           <div class="queue-time-label">Přidáno</div>
           <div class="queue-time-val">${fmtTime(item.created_at)}</div>
         </div>`;

    return `
      <div class="queue-item${isActive ? ' queue-item--active' : ''}">
        <div class="queue-pos">${pos}</div>
        <div class="queue-info">
          <a class="queue-id" href="${href}">${label}</a>
          ${item.name ? `<div class="queue-name">${item.name}</div>` : ''}
        </div>
        <span class="queue-command">${item.command}</span>
        ${timesHtml}
        ${badge}
      </div>`;
  }).join('');

  startTimers();
}

async function load() {
  try {
    const res = await fetch('/api/queue-status');
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    render(data.items || []);
  } catch {
    list.innerHTML = '<div class="queue-empty">Nepodařilo se načíst frontu.</div>';
  }
}

load();
setInterval(load, 3000);
</script>
</body>
</html>
