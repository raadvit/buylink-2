<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Story detail — Task Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
<style>
  html, body { height: 100%; overflow: hidden; display: flex; flex-direction: column; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .btn-validating-spinner { display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-right:6px;vertical-align:middle; }
</style>
<script src="/static/nav.js"></script>
<script src="/static/shared.js"></script>
<script src="/static/story-form.js"></script>
</head>
<body>
<div id="root" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
  <p style="padding:2rem;color:var(--ink-3)">Načítám…</p>
</div>
<script>
  const issueNumber = parseInt(location.pathname.replace('/us-', ''), 10);
  initNav('list');

  const EDITABLE_STATUSES = new Set(['new', '']);

  let _apiData   = null;
  let _sessionId = localStorage.getItem(`tf_session_${issueNumber}`) || null;
  let _pollTimer = null;
  const root = document.getElementById('root');
  const _LS_KEY = `tf_session_${issueNumber}`;

  fetch(`/api/issues/${issueNumber}`)
    .then(r => { if (!r.ok) return r.json().then(j => Promise.reject(j.error || r.status)); return r.json(); })
    .then(apiData => {
      _apiData = apiData;
      document.title = `US-${String(issueNumber).padStart(3,'0')} — ${apiData.title}`;
      const data      = storyDataFromApi(apiData);
      const editable  = EDITABLE_STATUSES.has(data.status);
      const NON_DELETABLE_STATUSES = new Set(['ready_for_testing', 'ready-for-testing', 'done', 'cancelled']);
      const canDelete = !NON_DELETABLE_STATUSES.has(data.status) && apiData.state !== 'closed';
      const idStr     = `US-${String(issueNumber).padStart(3,'0')}`;
      const breadcrumb = `<a href="/list">Všechny user stories</a><span class="sep">/</span><span class="mono">${idStr}</span>`;

      initStoryForm(root, data, {
        editable,
        breadcrumb,
        saveLabel:   'Uložit změny',
        submitLabel: 'Odeslat k validaci →',
        onSave:      editable ? updateStory : null,
        onSubmit:    editable ? submitStory : null,
        onDuplicate: duplicateStory,
        onDelete:    canDelete ? deleteStory : null,
      });
      initChatInput();

      // Figma načítání
      const btnFigma = root.querySelector('#btn-figma-load');
      if (btnFigma) {
        btnFigma.addEventListener('click', async () => {
          const url = root.querySelector('#f-figma-url')?.value?.trim();
          if (!url) { addChatMsg('Zadej Figma URL.', 'user'); return; }
          btnFigma.disabled = true;
          btnFigma.textContent = 'Načítám…';
          addChatMsg('Odesílám Figma URL agentovi…');
          addChatMsg('Product Owner načítá design přes MCP — může to trvat 20–60 sekund.');
          try {
            const res = await fetch('/api/figma-describe', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ figma_url: url, issue_number: issueNumber }),
            });
            const j = await res.json();
            if (!res.ok) throw new Error(j.error || res.status);
            const shows = root.querySelector('#f-shows');
            if (shows) { shows.value = j.description; _sfAutoGrow(shows); shows.dispatchEvent(new Event('input')); }
            const behaves = root.querySelector('#f-behaves');
            if (behaves && j.behaves) { behaves.value = j.behaves; _sfAutoGrow(behaves); behaves.dispatchEvent(new Event('input')); }
            const preview = root.querySelector('#figma-preview');
            if (preview && j.image_url) { preview.src = j.image_url; preview.style.display = 'block'; }
            root._figmaPreviewCdnUrl = j.image_url || '';
            addChatMsg('✓ Popis načten z Figmy a vyplněn do polí „Co se zobrazuje" a „Jak se to chová".');
          } catch (e) {
            addChatMsg('Chyba při načítání Figma: ' + e.message, 'user');
          } finally {
            btnFigma.disabled = false;
            btnFigma.textContent = 'Načíst';
          }
        });
      }

      // Tlačítka Vytvořit bug + Zavřít (ready_for_testing)
      const btnCreateBug = root.querySelector('#btn-create-bug');
      if (btnCreateBug) {
        btnCreateBug.addEventListener('click', () => {
          const id = `US-${String(issueNumber).padStart(3,'0')}`;
          sessionStorage.setItem('tf-new-bug', JSON.stringify({
            name: `${id} ${_apiData.title}`,
            epic: data.epic || '',
            roles: Array.isArray(data.role) ? data.role : [],
          }));
          window.location = '/create-bug';
        });
      }
      const btnCloseStory = root.querySelector('#btn-close-story');
      if (btnCloseStory) {
        btnCloseStory.addEventListener('click', async () => {
          btnCloseStory.disabled = true;
          try {
            const res = await fetch(`/api/stories/${issueNumber}/archive`, { method: 'POST' });
            const j = res.ok ? await res.json() : await res.json().catch(() => ({}));
            if (res.ok) { window.location = '/list'; }
            else { addChatMsg('Chyba: ' + (j.error || res.status), 'user'); btnCloseStory.disabled = false; }
          } catch (e) {
            addChatMsg('Síťová chyba: ' + e.message, 'user'); btnCloseStory.disabled = false;
          }
        });
      }

      // Tlačítko Clarify ve formuláři (editable)
      const btnClarifyForm = root.querySelector('#btn-clarify');
      if (btnClarifyForm) {
        btnClarifyForm.addEventListener('click', async () => {
          if (!sfValidate(root)) { addChatMsg('Vyplň prosím všechna povinná pole.', 'user'); return; }
          btnClarifyForm.disabled = true;
          setStatus('Ukládám…');
          try {
            const payload = root._getFormData();
            payload.name = payload.title; delete payload.title;
            const fd = new FormData();
            fd.append('data', JSON.stringify({ ...payload, issue_number: issueNumber, wiki_path: _apiData?.wiki_path }));
            (root._uploadedFiles || []).forEach(f => fd.append('files', f));
            const saveRes = await fetch('/api/update', { method: 'POST', body: fd });
            if (!saveRes.ok) throw new Error((await saveRes.json()).error || saveRes.status);
            const r = await fetch('/api/clarify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ issue_number: issueNumber, name: payload.name }),
            });
            const j = await r.json();
            if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
            _sessionId = j.session_id;
            localStorage.setItem(_LS_KEY, _sessionId);
            addChatMsg('Clarify agent generuje otázky… Počkej chvíli.');
            setBtns(true);
            startPolling();
          } catch (e) {
            addChatMsg('Chyba: ' + e.message, 'user');
            btnClarifyForm.disabled = false;
            setStatus('Chyba');
          }
        }, { once: true });
      }

      // Tlačítko Spustit Clarify (read-only, stav new)
      const btnClarify = root.querySelector('#btn-start-clarify');
      if (btnClarify) {
        btnClarify.addEventListener('click', async () => {
          btnClarify.disabled = true;
          try {
            const r = await fetch('/api/clarify', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ issue_number: issueNumber, name: _apiData?.title }),
            });
            const j = await r.json();
            if (!r.ok) { addChatMsg('Chyba: ' + (j.error || `HTTP ${r.status}`), 'user'); btnClarify.disabled = false; return; }
            _sessionId = j.session_id;
            localStorage.setItem(_LS_KEY, _sessionId);
            addChatMsg('Clarify agent generuje otázky… Počkej chvíli.');
            startPolling();
          } catch (e) {
            addChatMsg('Síťová chyba: ' + e.message, 'user'); btnClarify.disabled = false;
          }
        }, { once: true });
      }

      // Tlačítko Odeslat týmu k validaci (ze stavu clarify / needs-clarify)
      const btnSubmitTeam = root.querySelector('#btn-submit-team');
      if (btnSubmitTeam) {
        btnSubmitTeam.addEventListener('click', async () => {
          btnSubmitTeam.disabled = true;
          // Sesbírej odpovědi z clarify karet
          const cards = root.querySelectorAll('.cs-clarify-card');
          const answers = [];
          cards.forEach(card => {
            const idx = parseInt(card.dataset.idx, 10);
            const answer = card.querySelector('.cs-clarify-input')?.value?.trim() || '';
            if (answer) answers.push({ index: idx, answer });
          });
          try {
            // Zapiš odpovědi do wiki pokud existují
            if (answers.length > 0) {
              await fetch('/api/clarify/answers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ issue_number: issueNumber, answers }),
              });
            }
            // Zařaď analýzu do fronty
            const r = await fetch('/api/queue', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ issue_number: issueNumber, type: 'analysis' }),
            });
            const j = await r.json();
            if (!r.ok) { addChatMsg('Chyba: ' + (j.error || `HTTP ${r.status}`), 'user'); btnSubmitTeam.disabled = false; return; }
            if (j.session_id) { _sessionId = j.session_id; localStorage.setItem(_LS_KEY, _sessionId); }
            addChatMsg('Analýza zařazena do fronty…');
            renderTimelineInline(root.querySelector('#story-timeline-container'), 'draft-start');
            _waitForSession();
          } catch (e) {
            addChatMsg('Síťová chyba: ' + e.message, 'user'); btnSubmitTeam.disabled = false;
          }
        }, { once: true });
      }

      // Tlačítko Spustit vývoj
      const btnDev = root.querySelector('#btn-start-dev');
      if (btnDev) {
        btnDev.addEventListener('click', async () => {
          btnDev.disabled = true;
          try {
            const r = await fetch('/api/queue', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ issue_number: issueNumber, type: 'development' }),
            });
            const ct = r.headers.get('content-type') || '';
            const j = ct.includes('json') ? await r.json() : {};
            if (!r.ok) {
              addChatMsg('Chyba: ' + (j.error || `HTTP ${r.status}`), 'user');
              btnDev.disabled = false;
            }
          } catch (e) {
            addChatMsg('Síťová chyba: ' + e.message, 'user');
            btnDev.disabled = false;
          }
        }, { once: true });
      }

      // Vykresli timeline
      const tlContainer = root.querySelector('#story-timeline-container');
      if (tlContainer && typeof renderTimelineInline === 'function') {
        renderTimelineInline(tlContainer, data.status || '');
      }

      // Zobraz blocker důvod v chatu pokud je story blocked
      if (data.status === 'blocked') {
        const wiki = apiData.wiki || apiData.body || '';
        const conflictsMatch = wiki.match(/(?:##\s+|h2\. )Konflikty\s*\n([\s\S]*?)(?=\n(?:##\s|h2\.)|---\s*\n|$)/);
        const chat = root.querySelector('#agentChat');
        function addBlockerCard(description, resolution) {
          if (!chat) return;
          const msgDiv = document.createElement('div');
          msgDiv.className = 'cs-msg agent';
          const msgAv = document.createElement('div');
          msgAv.className = 'cs-msg-av cs-msg-av--agent';
          msgAv.textContent = 'F';
          const card = document.createElement('div');
          card.style.cssText = 'background:oklch(96% 0.05 80);border:1px solid oklch(88% 0.08 80);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1;';
          const header = document.createElement('div');
          header.style.cssText = 'display:flex;align-items:center;gap:8px;';
          header.innerHTML = `
            <span style="width:28px;height:28px;border-radius:8px;background:var(--accent);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1 L11 6 L6 11 L1 6 Z" fill="white"/></svg>
            </span>
            <span style="font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:oklch(50% 0.13 75);">● Blocked</span>`;
          const body = document.createElement('div');
          body.style.cssText = 'font-size:13px;color:var(--ink);line-height:1.5;';
          body.textContent = description;
          card.appendChild(header);
          card.appendChild(body);
          if (resolution) {
            const res = document.createElement('div');
            res.style.cssText = 'font-size:12px;color:var(--ink-2);line-height:1.4;';
            res.textContent = '→ ' + resolution;
            card.appendChild(res);
          }
          msgDiv.append(msgAv, card);
          chat.appendChild(msgDiv);
          chat.scrollTop = chat.scrollHeight;
        }

        if (conflictsMatch) {
          const blocks = conflictsMatch[1].trim().split(/\n(?=###)/).map(b => b.trim()).filter(Boolean);
          if (blocks.length === 0) {
            addBlockerCard('Story je blokována — důvod není specifikován.', null);
          } else {
            blocks.forEach(block => {
              const desc = block.match(/\*\*DESCRIPTION:\*\*\s*([^\n]+)/)?.[1]?.trim()
                        || block.match(/DESCRIPTION:\s*([^\n]+)/)?.[1]?.trim();
              const res  = block.match(/\*\*SUGGESTED_RESOLUTION:\*\*\s*([^\n]+)/)?.[1]?.trim()
                        || block.match(/SUGGESTED_RESOLUTION:\s*([^\n]+)/)?.[1]?.trim();
              if (desc) addBlockerCard(desc, res || null);
            });
          }
        } else {
          addBlockerCard('Story je blokována — důvod není specifikován.', null);
        }
      }

      if (data.status === 'validated' || data.status === 'dev-plan') {
        addChatMsg('Analýza proběhla úspěšně. Story je připravena k implementaci.');
      }

      // Zobraz clarify otázky ze sekce ## Clarify ve wiki
      if (data.status === 'clarify' || data.status === 'needs-clarify') {
        const wiki = apiData.wiki || apiData.body || '';
        const clarifyMatch = wiki.match(/(?:##\s+|h2\. )Clarify\s*\n([\s\S]*?)(?=\n(?:##\s|h2\.)|---\s*\n|$)/);
        if (clarifyMatch) {
          const questions = [];
          clarifyMatch[1].split('\n').forEach(line => {
            const m = line.match(/^(\d+)\.\s+(.+?)(?:\s*→.*)?$/);
            if (m) questions.push({ index: parseInt(m[1], 10), text: m[2].trim() });
          });
          if (questions.length > 0) {
            const chat = root.querySelector('#agentChat');
            const intro = document.createElement('div');
            intro.className = 'cs-msg agent';
            intro.innerHTML = '<div class="cs-msg-av cs-msg-av--agent">F</div><div class="cs-msg-body">Agent připravil otázky ke story. Odpověz prosím na všechny a pak klikni <strong>Odeslat týmu k validaci</strong>.</div>';
            if (chat) chat.appendChild(intro);
            questions.forEach(q => {
              const card = document.createElement('div');
              card.className = 'cs-clarify-card';
              card.dataset.idx = q.index;
              card.style.cssText = 'margin:6px 0 6px 36px;background:var(--surface-2,#f5f5f5);border:1px solid var(--border);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;';
              card.innerHTML = `<div style="font-size:12px;font-weight:600;color:var(--ink-2)">${q.index}. otázka</div>
                <div style="font-size:13px;color:var(--ink)">${escHtml(q.text)}</div>
                <textarea class="cs-clarify-input tf-textarea" rows="2" placeholder="Tvoje odpověď…" style="resize:vertical"></textarea>`;
              if (chat) chat.appendChild(card);
            });
            if (chat) chat.scrollTop = chat.scrollHeight;
          }
        } else if (data.status === 'needs-clarify') {
          addChatMsg('Analýza narazila na nejasnosti. Přidej doplňující informace a spusť analýzu znovu.');
        } else {
          addChatMsg('Clarify agent nenašel žádné kritické nejasnosti. Story je připravena k odeslání týmu k validaci.');
        }
      }

      // Načti epics pro datalist
      if (editable) {
        fetch('/api/issues')
          .then(r => r.json())
          .then(issues => {
            const epics = [...new Set(issues.map(i => i.epic).filter(Boolean))];
            const dl = root.querySelector('#epic-suggestions');
            if (dl) dl.innerHTML = epics.map(e => `<option value="${e}">`).join('');
          })
          .catch(() => {});
      }

      // Auto-spustit validaci při přesměrování z vytvoření (?submit=1)
      if (editable && new URLSearchParams(location.search).get('submit') === '1') {
        history.replaceState(null, '', location.pathname);
        submitStory();
      }

      // Auto-spustit clarify při přesměrování z /create-story-2 (?clarify=1)
      if (new URLSearchParams(location.search).get('clarify') === '1') {
        history.replaceState(null, '', location.pathname);
        root.querySelector('#btn-clarify, #btn-start-clarify')?.click();
      }

      // Obnovit polling pokud existuje uložená session (a není hotová)
      if (_sessionId) {
        fetch('/api/session?session_id=' + encodeURIComponent(_sessionId))
          .then(r => r.json())
          .then(s => {
            if (s.status === 'done' || s.status === 'error' || s.error) {
              localStorage.removeItem(_LS_KEY);
              _sessionId = null;
              loadChatHistory();
            } else {
              setValidating(true);
              setChatInputEnabled(true);
              startPolling();
            }
          })
          .catch(() => {
            localStorage.removeItem(_LS_KEY);
            _sessionId = null;
            loadChatHistory();
          });
      } else {
        loadChatHistory();
      }
    })
    .catch(err => {
      const el = document.createElement('div');
      el.style.cssText = 'padding:2rem;color:var(--danger)';
      el.textContent = 'Nepodařilo se načíst story: ' + err;
      root.replaceChildren(el);
    });

  // ── Duplicate ──────────────────────────────────────────────────────────────
  function duplicateStory() {
    if (!_apiData) return;
    const data = storyDataFromApi(_apiData);
    sessionStorage.setItem('tf-duplicate', JSON.stringify({
      title:     data.title,
      epic:      data.epic,
      role:      data.role,
      why:       data.why,
      shows:     data.shows,
      behaves:   data.behaves,
      risk:      data.risk,
      open:      data.open,
      ac:        data.ac,
      figma_url: data.figma_url ?? '',
    }));
    window.location = '/create-story-2';
  }

  // ── Helpers ────────────────────────────────────────────────────────────────
  const _userAv = document.querySelector('.user-menu__avatar')?.textContent?.trim() || 'BO';
  function addChatMsg(text, role = 'agent') {
    const chat = root.querySelector('#agentChat');
    if (!chat) return;
    const div = document.createElement('div');
    div.className = `cs-msg ${role}`;
    const av = document.createElement('div');
    av.className = `cs-msg-av cs-msg-av--${role === 'user' ? 'user' : 'agent'}`;
    av.textContent = role === 'user' ? _userAv : 'F';
    const body = document.createElement('div');
    body.className = 'cs-msg-body';
    body.textContent = text;
    div.append(role === 'user' ? body : av, role === 'user' ? av : body);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function setStatus(text) {
    const el = root.querySelector('.cs-agent-status');
    if (el) el.innerHTML = `<span class="cs-agent-status-dot"></span>${text}`;
  }

  function setBtns(disabled) {
    root.querySelector('#btn-save')  ?.toggleAttribute('disabled', disabled);
    root.querySelector('#btn-submit')?.toggleAttribute('disabled', disabled);
    root.querySelector('#btn-delete')?.toggleAttribute('disabled', disabled);
  }

  function setChatInputEnabled(on) {
    const inp = root.querySelector('#agentInput');
    const btn = root.querySelector('#agentSend');
    if (inp) inp.disabled = !on;
    if (btn) btn.disabled = !on;
  }

  function initChatInput() {
    const inp = root.querySelector('#agentInput');
    const btn = root.querySelector('#agentSend');
    if (!inp || !btn) return;
    setChatInputEnabled(false);
    async function sendMsg() {
      const text = inp.value.trim();
      if (!text || !_sessionId) return;
      inp.value = '';
      addChatMsg(text, 'user');
      try {
        await fetch(`/api/session/${_sessionId}/push`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type: 'message', text, agent: 'user' }),
        });
      } catch {}
    }
    btn.addEventListener('click', sendMsg);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
  }

  function setValidating(on) {
    setBtns(on);
    const btn = root.querySelector('#btn-submit');
    if (!btn) return;
    if (on) {
      if (!btn.dataset.origText) btn.dataset.origText = btn.innerHTML;
      btn.innerHTML = '<span class="btn-validating-spinner"></span>Validace probíhá…';
    } else if (btn.dataset.origText) {
      btn.innerHTML = btn.dataset.origText;
      delete btn.dataset.origText;
    }
  }

  async function loadChatHistory() {
    try {
        const res = await fetch(`/api/chat?issue_number=${issueNumber}`);
        if (!res.ok) return;
        const { messages } = await res.json();
        const chat = root.querySelector('#agentChat');
        if (!chat || !Array.isArray(messages) || !messages.length) return;
        messages.forEach(m => addChatMsg(m.text, m.role === 'user' ? 'user' : 'agent'));
    } catch {}
  }

  // ── Delete ─────────────────────────────────────────────────────────────────
  async function deleteStory() {
    const idStr = `US-${String(issueNumber).padStart(3,'0')}`;
    if (!confirm(`Opravdu smazat story #${issueNumber} (${idStr})? Tuto akci nelze vrátit.`)) return;
    setBtns(true); setStatus('Mažu…');
    try {
      const res = await fetch(`/api/issues/${issueNumber}`, { method: 'DELETE' });
      const ct = res.headers.get('content-type') || '';
      const json = ct.includes('json') ? await res.json() : {};
      if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
      window.location = '/list';
    } catch (e) {
      addChatMsg('Chyba při mazání: ' + e.message, 'user');
      setStatus('Chyba'); setBtns(false);
    }
  }

  // ── Update (Uložit změny) ──────────────────────────────────────────────────
  async function updateStory() {
    const payload = root._getFormData();
    payload.name = payload.title; delete payload.title;
    if (!payload.name) {
      const t = root.querySelector('#f-title');
      if (t) { t.style.borderColor = 'var(--danger)'; t.style.boxShadow = '0 0 0 3px var(--danger-2)'; t.scrollIntoView({ behavior:'smooth', block:'center' }); }
      return;
    }
    setBtns(true); setStatus('Ukládám změny…');
    try {
      const fd = new FormData();
      fd.append('data', JSON.stringify({ ...payload, issue_number: issueNumber, wiki_path: _apiData?.wiki_path, story_status: _apiData?.story_status, figma_image_cdn_url: root._figmaPreviewCdnUrl || '' }));
      (root._uploadedFiles || []).forEach(f => fd.append('files', f));
      const res = await fetch('/api/update', { method: 'POST', body: fd });
      if (!res.ok) throw new Error((await res.json()).error || res.status);
      addChatMsg('Změny uloženy.');
      setStatus('Uloženo');
    } catch (e) {
      addChatMsg('Chyba při ukládání: ' + e.message, 'user');
      setStatus('Chyba');
    } finally { setBtns(false); }
  }

  // ── Submit (Odeslat k validaci) ────────────────────────────────────────────
  async function submitStory() {
    if (!sfValidate(root)) {
      addChatMsg('Vyplň prosím všechna povinná pole (označena *).', 'user');
      return;
    }
    setValidating(true); setStatus('Ukládám…');
    try {
      // 1. Ulož aktuální stav story
      const payload = root._getFormData();
      payload.name = payload.title; delete payload.title;
      const fd = new FormData();
      fd.append('data', JSON.stringify({ ...payload, issue_number: issueNumber, wiki_path: _apiData?.wiki_path }));
      (root._uploadedFiles || []).forEach(f => fd.append('files', f));
      const saveRes = await fetch('/api/update', { method: 'POST', body: fd });
      if (!saveRes.ok) {
        const ct = saveRes.headers.get('content-type') || '';
        const msg = ct.includes('json') ? (await saveRes.json()).error : `HTTP ${saveRes.status}`;
        throw new Error(msg || saveRes.status);
      }

      // 2. Zařaď analýzu do fronty
      setStatus('Odesílám agentům…');
      const analyzeRes = await fetch('/api/queue', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ issue_number: issueNumber, type: 'analysis' }) });
      if (!analyzeRes.ok) {
        const ct = analyzeRes.headers.get('content-type') || '';
        const msg = ct.includes('json') ? (await analyzeRes.json()).error : `HTTP ${analyzeRes.status}`;
        throw new Error(msg || analyzeRes.status);
      }
      addChatMsg('Story odeslána k validaci. Analýza začíná… Můžeš okno zavřít.');
      renderTimelineInline(root.querySelector('#story-timeline-container'), 'draft-start');
      _waitForSession();

      fetch(`/api/issues/${issueNumber}`)
        .then(r => r.json())
        .then(fresh => { _apiData = fresh; })
        .catch(() => {});
    } catch (e) {
      addChatMsg('Chyba: ' + e.message, 'user');
      setStatus('Chyba'); setValidating(false);
    }
  }

  // ── Polling ────────────────────────────────────────────────────────────────
  const PHASE_LABELS = {
    'clarify-start':'Clarify agent generuje otázky…','clarify-finished':'Otázky připraveny — stránka se znovu načte.',
    'draft-start':'Product Owner zpracovává zadání…','draft-finished':'Product Owner hotov…',
    'conflict-check-start':'Conflict Detector kontroluje závislosti…',
    'conflict-check-finished':'Konflikty OK…','conflict-check-failed':'⚠ Konflikty nalezeny!',
    'arch-review-start':'Architekt přidává technické anotace…',
    'arch-review-finished':'Architektura hotova. Story je připravena k vývoji.',
    'done':'✓ Validace dokončena.',
    'product_owner':'Product Owner zpracovává zadání…',
    'conflict_detector':'Conflict Detector kontroluje závislosti…',
    'architect':'Architekt přidává technické anotace…',
  };

  const _shownQuestions = new Set();
  const _shownMessages  = new Set();

  function renderQuestionCard(q) {
    const card = document.createElement('div');
    card.className = 'cs-question-card';
    card.dataset.qid = q.id;
    const agentEl = document.createElement('div');
    agentEl.className = 'cs-question-agent';
    agentEl.textContent = (q.agent || 'Agent') + ' se ptá:';
    const textEl = document.createElement('div');
    textEl.className = 'cs-question-text';
    textEl.textContent = q.text;
    const ta = document.createElement('textarea');
    ta.className = 'cs-question-input tf-textarea';
    ta.rows = 2;
    ta.placeholder = 'Tvoje odpověď…';
    const btn = document.createElement('button');
    btn.className = 'tf-btn tf-btn-primary cs-question-send';
    btn.type = 'button';
    btn.style.cssText = 'margin-top:6px;align-self:flex-end';
    btn.textContent = 'Odeslat';
    card.append(agentEl, textEl, ta, btn);
    btn.addEventListener('click', async () => {
      const answer = ta.value.trim();
      if (!answer) { ta.style.borderColor = 'var(--danger)'; return; }
      btn.disabled = true; ta.disabled = true;
      try {
        const res = await fetch('/api/answer', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ session_id: _sessionId, question_id: q.id, answer }),
        });
        if (!res.ok) throw new Error((await res.json()).error || res.status);
        card.classList.add('cs-question-answered');
        addChatMsg('✓ Odpověď odeslána.');
      } catch (e) {
        btn.disabled = false; ta.disabled = false;
        addChatMsg('Chyba při odesílání: ' + e.message, 'user');
      }
    });
    return card;
  }

  async function _waitForSession() {
    const deadline = Date.now() + 15000;
    while (Date.now() < deadline) {
      await new Promise(r => setTimeout(r, 1500));
      try {
        const res = await fetch(`/api/session/by-issue?issue_number=${issueNumber}`);
        if (res.ok) {
          const d = await res.json();
          if (d.session_id) {
            _sessionId = d.session_id;
            localStorage.setItem(_LS_KEY, _sessionId);
            startPolling();
            return;
          }
        }
      } catch {}
    }
    addChatMsg('Agent pracuje na pozadí.');
    setValidating(false);

    // Pokračuj v hledání session na pozadí (fronta může trvat déle než 15s)
    const bgDeadline = Date.now() + 30 * 60 * 1000;
    const bgTimer = setInterval(async () => {
      if (Date.now() > bgDeadline || _sessionId) { clearInterval(bgTimer); return; }
      try {
        const res = await fetch(`/api/session/by-issue?issue_number=${issueNumber}`);
        if (res.ok) {
          const d = await res.json();
          if (d.session_id) {
            clearInterval(bgTimer);
            _sessionId = d.session_id;
            localStorage.setItem(_LS_KEY, _sessionId);
            startPolling();
          }
        }
      } catch {}
    }, 10000);
  }

  function startPolling() {
    if (_pollTimer) clearInterval(_pollTimer);
    const deadline = Date.now() + 30 * 60 * 1000; // 30 min — fronta + analýza
    let lastPhase = null;
    let lastQueuePos = null;
    _pollTimer = setInterval(async () => {
      if (Date.now() > deadline) { clearInterval(_pollTimer); setValidating(false); return; }
      try {
        const data = await (await fetch('/api/session?session_id=' + encodeURIComponent(_sessionId))).json();

        if (data.status === 'queued') {
          const pos = data.queue_position;
          if (pos !== lastQueuePos) {
            lastQueuePos = pos;
            setStatus(`Ve frontě (pozice ${pos})`);
          }
          return;
        }

        // Zobraz nové zprávy od agentů
        (data.messages || []).filter(m => !_shownMessages.has(m.id)).forEach(m => {
          _shownMessages.add(m.id);
          addChatMsg(m.text, 'agent');
        });

        if (data.status === 'asking_questions') {
          const questions = data.questions || [];
          const chat = root.querySelector('#agentChat');
          setStatus(`Čeká na odpovědi (${data.validation_agent || 'Agent'})`);
          questions.filter(q => !q.answer && !_shownQuestions.has(q.id)).forEach(q => {
            _shownQuestions.add(q.id);
            if (chat) chat.appendChild(renderQuestionCard(q));
          });
          if (chat) chat.scrollTop = chat.scrollHeight;
          setChatInputEnabled(true);
          return;
        }

        const phase = data.validation_phase;
        if (phase && phase !== lastPhase) {
          lastPhase = phase;
          const label = PHASE_LABELS[phase];
          if (label) { addChatMsg(label); setStatus(label.replace('…', '')); }
          const tlContainer = root.querySelector('#story-timeline-container');
          if (tlContainer && typeof renderTimelineInline === 'function') {
            renderTimelineInline(tlContainer, phase);
          }
        }

        if (data.status === 'done' || data.status === 'building') {
          clearInterval(_pollTimer);
          localStorage.removeItem(_LS_KEY);
          addChatMsg('✓ Validace dokončena. Stránka se znovu načte.');
          setStatus('Hotovo'); setValidating(false);
          setTimeout(() => location.reload(), 1500);
        }
        if (data.status === 'error') {
          clearInterval(_pollTimer);
          localStorage.removeItem(_LS_KEY);
          addChatMsg('Chyba validace: ' + (data.error || ''), 'user');
          setStatus('Chyba'); setValidating(false);
        }
      } catch {}
    }, 3000);
  }
</script>
