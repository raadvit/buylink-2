<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Implementation Timeline</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      padding: 40px 16px;
      color: #1a1a1a;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #fff;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 0 0 0.5px #e0e0e0;
    }

    /* ========== TIMELINE ========== */

    .impl-timeline {
      display: flex;
      align-items: center;
      margin-bottom: 24px;
      overflow-x: auto;
    }

    .impl-step {
      position: relative;
      flex: 1;
      min-width: 110px;
      text-align: center;
      padding-top: 22px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #aaa;
    }

    /* circle */
    .impl-step::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #e0e0e0;
      transform: translateX(-50%);
      z-index: 2;
    }

    /* line */
    .impl-step::after {
      content: "";
      position: absolute;
      top: 5px;
      left: -50%;
      width: 100%;
      height: 3px;
      background: #e0e0e0;
      z-index: 1;
    }

    .impl-step:first-child::after {
      display: none;
    }

    /* ✅ PASSED */
    .impl-step.passed {
      color: #2e7d32;
    }

    .impl-step.passed::before,
    .impl-step.passed::after {
      background: #43a047;
    }

    /* 🔵 PENDING (čeká na spuštění) */
    .impl-step.pending {
      color: #1565c0;
    }

    .impl-step.pending::before {
      background: #1976d2;
    }

    /* 🔴 BLOCKED (nutná akce) */
    .impl-step.blocked {
      color: #c62828;
    }

    .impl-step.blocked::before {
      background: #e53935;
    }

    .impl-step.blocked::after {
      background: #e53935;
    }

    h1 {
      font-size: 28px;
      margin: 0;
      font-weight: 700;
    }

    .hint {
      margin-top: 8px;
      font-size: 18px;
      color: #555;
    }
  </style>
</head>
<body>

<div class="container">

  <!--
    NASTAVENÍ:
    data-last-success = poslední krok, který PROŠEL
    data-blocked      = krok, který NEPROŠEL (volitelné)

    PŘÍKLADY:
    ✅ běží:      data-last-success="arch-approved"
    🔵 čeká:     data-last-success="conflict-check"
    🔴 stopka:   data-last-success="conflict-check" data-blocked="ready-for-arch"
  -->
  <div class="impl-timeline"
       data-last-success="conflict-check"
       data-blocked="ready-for-arch">

    <div class="impl-step" data-step="draft">draft</div>
    <div class="impl-step" data-step="conflict-check">conflict-check</div>
    <div class="impl-step" data-step="ready-for-arch">arch-review</div>
    <div class="impl-step" data-step="arch-approved">dev-plan</div>
    <div class="impl-step" data-step="in-development">development</div>
    <div class="impl-step" data-step="ready-for-pr">ready-for-pr</div>
    <div class="impl-step" data-step="done">done</div>
  </div>

  <h1>Checkout – výběr AlzaBoxu</h1>
  <div class="hint">
    4 stavy: šedá (nestartovalo), zelená (prošlo), modrá (čeká), červená (nutná akce)
  </div>

</div>

<script>
  const steps = [
    'draft',
    'conflict-check',
    'ready-for-arch',
    'arch-approved',
    'in-development',
    'ready-for-pr',
    'done'
  ];

  (function initTimeline() {
    const timeline = document.querySelector('.impl-timeline');
    if (!timeline) return;

    const lastSuccess = timeline.dataset.lastSuccess;
    const blocked = timeline.dataset.blocked;

    const lastIdx = steps.indexOf(lastSuccess);
    const blockedIdx = blocked ? steps.indexOf(blocked) : -1;

    timeline.querySelectorAll('.impl-step').forEach(step => {
      const idx = steps.indexOf(step.dataset.step);

      step.classList.remove('passed','pending','blocked');

      // 🟢 PROŠLO – jen do místa, kde není blokace
      if (idx <= lastIdx && (blockedIdx === -1 || idx < blockedIdx)) {
        step.classList.add('passed');
      }

      // 🔴 BLOKACE
      if (idx === blockedIdx) {
        step.classList.add('blocked');
      }

      // 🔵 ČEKÁ NA SPUŠTĚNÍ (jen pokud není blokace)
      if (blockedIdx === -1 && idx === lastIdx + 1) {
        step.classList.add('pending');
      }
    });
  })();
</script>

</body>
</html>
