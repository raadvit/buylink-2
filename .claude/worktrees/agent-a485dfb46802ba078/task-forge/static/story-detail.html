<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Story detail — Task Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;550;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
<script src="/static/nav.js"></script>
</head>
<body>
<main class="page" id="app">
  <p style="color:var(--ink-3);padding:2rem 0">Načítám…</p>
</main>
<script>
  const issueNumber = parseInt(location.pathname.replace('/us-', ''), 10);

  initNav('list');

  fetch(`/api/issues/${issueNumber}`)
    .then(r => {
      if (!r.ok) return r.json().then(j => Promise.reject(j.error || r.status));
      return r.json();
    })
    .then(data => {
      document.title = `US-${String(issueNumber).padStart(3,'0')} — ${data.title}`;
      document.getElementById('app').innerHTML = `
        <div class="page__header">
          <div class="page__breadcrumb mono">
            <a href="/list-2" style="color:inherit;text-decoration:none">← Seznam stories</a>
            &nbsp;·&nbsp; ${data.epic || ''}
          </div>
          <h1 class="page__title">${escapeHTML(data.title)}</h1>
        </div>
      `;
    })
    .catch(err => {
      document.getElementById('app').innerHTML =
        `<div class="page__header"><p style="color:var(--danger)">Nepodařilo se načíst story: ${err}</p></div>`;
    });

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
</script>
</body>
</html>
